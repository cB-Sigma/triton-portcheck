# Manifest behind `triton-portcheck check --demo`.
# Every row is a real kernel in triton_portcheck/demo/kernels.py.

[defaults]
targets = [
  "cuda:75", "cuda:80", "cuda:90", "cuda:100", "cuda:120",
  "hip:gfx942", "hip:gfx950", "hip:gfx1100", "hip:gfx1250",
]
timeout = 120

[[kernel]]
name = "axpy"
target = "kernels.py:axpy"
signature = { x_ptr = "*fp32", y_ptr = "*fp32", out_ptr = "*fp32", alpha = "fp32", n = "i32" }
constants = { BLOCK = 256 }

[[kernel]]
name = "gamma_ratio"
target = "kernels.py:gamma_ratio"
signature = { x_ptr = "*fp32", out_ptr = "*fp32", n = "i32" }
constants = { BLOCK = 256 }

[[kernel]]
name = "gamma_ratio_guarded"
target = "kernels.py:gamma_ratio_guarded"
signature = { x_ptr = "*fp32", out_ptr = "*fp32", n = "i32" }
constants = { BLOCK = 256 }

[[kernel]]
name = "quantize_fp8"
target = "kernels.py:quantize_fp8"
signature = { x_ptr = "*fp32", q_ptr = "*fp8e4nv", scale = "fp32", n = "i32" }
constants = { BLOCK = 256 }

[[kernel]]
name = "scatter_rows"
target = "kernels.py:scatter_rows"
signature = { desc = "tensordesc<fp32[1,32]>", row_ptr = "*i32", src_ptr = "*fp32" }
constants = { ROWS = 32, COLS = 32 }

[[kernel]]
name = "dot_small"
target = "kernels.py:dot_small"
signature = { a_ptr = "*fp16", b_ptr = "*fp16", c_ptr = "*fp32" }
constants = { M = 32, N = 32, K = 32 }

  [[kernel.variant]]
  name = "fp16"

  [[kernel.variant]]
  name = "int8"
  signature = { a_ptr = "*i8", b_ptr = "*i8", c_ptr = "*i32" }

[[kernel]]
name = "rowsum_blockptr"
target = "kernels.py:rowsum_blockptr"
signature = { a_ptr = "*fp32", out_ptr = "*fp32", M = "i32", N = "i32", stride_m = "i32", stride_n = "i32" }
constants = { BM = 16, BN = 16 }

[[kernel]]
name = "poll_flags"
target = "kernels.py:poll_flags"
signature = { flag_ptr = "*i32", out_ptr = "*i32" }
constants = { BLOCK = 64 }
